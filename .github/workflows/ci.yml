name: ci

on:
  push:
    branches: [main]
  pull_request:

# cancel an in-progress run when a newer commit arrives on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# the workflow only reads the repository; it needs no other permissions.
permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: check formatting
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "${unformatted}" ]; then
            echo "these files need gofmt -s:"
            echo "${unformatted}"
            exit 1
          fi

      - name: check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: verify dependency checksums
        run: go mod verify

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
