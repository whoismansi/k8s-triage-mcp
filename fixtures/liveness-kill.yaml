# Scenario 3: SIGKILL that is not an OOM.
# sleep runs as PID 1 and ignores SIGTERM. When the liveness probe fails, the
# kubelet waits out the grace period and sends SIGKILL: exit 137, but no OOM.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveness-kill
  namespace: triage-demo
  labels: {fixture: liveness-kill}
spec:
  replicas: 1
  selector:
    matchLabels: {app: liveness-kill}
  template:
    metadata:
      labels: {app: liveness-kill}
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          livenessProbe:
            exec: {command: ["false"]}
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 1
