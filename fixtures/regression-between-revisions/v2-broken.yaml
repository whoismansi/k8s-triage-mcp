# Scenario 6, revision 2: the "harmless refactor" that breaks the app.
# The ConfigMap key is renamed in the Deployment but not in the ConfigMap, and
# the image tag is bumped at the same time as a red herring.
# Expect from diff: env.DB_HOST configMapKeyRef(app-config/db_host) ->
# configMapKeyRef(app-config/database_host), plus image_changed.
# Expect on new pods: container_config_error (key not found).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: triage-demo
  labels: {fixture: orders}
spec:
  replicas: 2
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: {name: app-config, key: database_host}
