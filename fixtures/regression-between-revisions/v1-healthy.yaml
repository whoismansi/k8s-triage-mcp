# Scenario 6, revision 1: healthy.
# The app reads DB_HOST from a ConfigMap key that exists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: triage-demo
data:
  db_host: postgres.internal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: triage-demo
  labels: {fixture: orders}
spec:
  replicas: 2
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      containers:
        - name: app
          image: nginx:1.27
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef: {name: app-config, key: db_host}
